<!-- The table element represents data with more than one dimension, in the form of a table. -->
<table></table>                                
<table border=" "></table>

<thead></thead>
<tbody></tbody>
<tfoot></tfoot>
<tr></tr>
<th></th>
<td></td>
<td colspan=" "></td>
<td rowspan=" "></td>
<caption></caption>



<table border=" ">
    <!-- title of the table -->
    <caption> </caption>

    <thead>
        <!-- The tr element represents a row of cells in a table. -->
        <tr>
            <th></th>
            <th></th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        <!-- heading and data of table body - row 1 consisting 2 column -->
        <tr>
            <!-- header cell in a table. -->
            <th></th>
            <!-- data cell in a table. -->
            <td></td>
        </tr>

        <!-- rowspan & colspan - table body row 2 consisting 3 column  -->
        <tr>
            <td rowspan=" "></td>
            <td colspan=" "></td>
            <td rowspan=" " colspan=" "></td>
        </tr>

        <!-- nested table in table body - row 3 consisting a table with 1 row 2 column -->
        <tr>
            <th></th>
            <td>
                <table>
                    <tbody>
                        <tr>
                            <td></td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </tbody>
</table>
